<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="login.title">登录 - We Apps Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      margin-top: -0.75rem;
      margin-bottom: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="lang-switcher-container" style="position:fixed;top:1.5rem;right:1.5rem;z-index:100;"></div>
  <div class="auth-layout">
    <!-- Left Panel -->
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/We.png" alt="We Apps" class="logo-large">
        <h1 data-i18n="login.heading">We Apps Account</h1>
        <p data-i18n="login.tagline">一个 We Apps 账户，畅享所有 We Apps 服务</p>
      </div>
    </div>

    <!-- Right Panel - Login Form -->
    <div class="auth-right">
      <div class="auth-card">
        <img src="assets/We.png" alt="We" class="logo-small">
        <h2 data-i18n="login.welcome">欢迎回来</h2>
        <p class="subtitle" data-i18n="login.subtitle">登录您的 We Apps 账户</p>

        <div id="login-alert" class="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" data-i18n="login.emailLabel">电子邮件 <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" data-i18n-placeholder="login.emailPlaceholder" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password" data-i18n="login.passwordLabel">密码 <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" data-i18n-placeholder="login.passwordPlaceholder" placeholder="输入密码" required autocomplete="current-password">
              <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="切换密码可见性">👁</button>
            </div>
          </div>

          <a href="forgot.html" class="forgot-link" data-i18n="login.forgot">忘记密码？</a>

          <div class="checkbox-group">
            <input type="checkbox" id="remember" checked>
            <label for="remember" data-i18n="login.remember">记住我</label>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary">
            <span class="spinner"></span>
            <span class="btn-text" data-i18n="login.loginBtn">登录</span>
          </button>
        </form>

        <div class="auth-footer">
          <span data-i18n="login.haveAccount">还没有账户？</span> <a href="register.html" data-i18n="login.register">立即注册</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    // Inject language switcher
    document.getElementById('lang-switcher-container').innerHTML = renderLanguageSwitcher();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('login-alert');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !validateEmail(email)) {
        showAlert('login-alert', t('login.invalidEmail'), 'error');
        document.getElementById('email').classList.add('error');
        return;
      }

      if (!password) {
        showAlert('login-alert', t('login.passwordMin8'), 'error');
        document.getElementById('password').classList.add('error');
        return;
      }

      setLoading('login-btn', true);

      try {
        await account.createEmailPasswordSession(email, password);
        showToast(t('login.loggingIn'), 'success');
        setTimeout(() => navigateTo('dashboard.html'), 800);
      } catch (err) {
        const messages = {
          'user_invalid_credentials': t('login.invalidCredentials'),
          'user_session_already_exists': t('login.sessionExists'),
          'general_rate_limit_exceeded': t('login.rateLimit'),
          'user_blocked': t('login.accountBlocked'),
        };
        const msg = messages[err.type] || err.message || t('login.loginFailed');
        showAlert('login-alert', msg, 'error');
        if (err.type === 'user_session_already_exists') {
          setTimeout(() => navigateTo('dashboard.html'), 800);
        }
      } finally {
        setLoading('login-btn', false);
      }
    });

    // Clear error on input
    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('input', () => input.classList.remove('error'));
    });

    // Auto-redirect if already logged in
    (async () => {
      const user = await checkAuth();
      if (user) navigateTo('dashboard.html');
    })();
  </script>
</body>
</html>
