<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="verify.title">邮箱验证 - We Apps Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="lang-switcher-container" style="position:fixed;top:1.5rem;right:1.5rem;z-index:100;"></div>

  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/We.png" alt="We Apps" class="logo-large">
        <h1 data-i18n="verify.heading">验证邮箱</h1>
        <p data-i18n="verify.tagline">确认您的邮箱地址以完成账户设置</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <img src="assets/We.png" alt="We" class="logo-small">
        <h2 data-i18n="verify.verifyEmail">邮箱验证</h2>
        <p class="subtitle" data-i18n="verify.subtitle">请输入您收到的验证码</p>

        <div id="verify-alert" class="alert"></div>

        <form id="verify-form" novalidate>
          <div class="form-group">
            <label for="user-id" data-i18n="verify.userIdLabel">用户 ID</label>
            <input type="text" id="user-id" class="form-input" data-i18n-placeholder="verify.userIdPlaceholder" placeholder="从邮件链接中获取" readonly>
          </div>

          <div class="form-group">
            <label for="secret"><span data-i18n="verify.secretLabel">验证码</span> <span class="required">*</span></label>
            <input type="text" id="secret" class="form-input" data-i18n-placeholder="verify.secretPlaceholder" placeholder="输入验证码" required>
          </div>

          <button type="submit" id="verify-btn" class="btn btn-primary">
            <span class="spinner"></span>
            <span class="btn-text" data-i18n="verify.verifyBtn">验证邮箱</span>
          </button>
        </form>

        <div class="divider"><span data-i18n="verify.or">或者</span></div>

        <button id="resend-btn" class="btn btn-secondary" style="width:100%;" onclick="resendVerification()">
          <span data-i18n="verify.resend">重新发送验证邮件</span>
        </button>

        <div class="auth-footer">
          <a href="index.html" data-i18n="common.backToLogin">返回登录</a>
        </div>
        <div class="auth-footer auth-footer-legal">
          <a href="terms.html" target="_blank" rel="noopener" data-i18n="legal.terms">服务条款</a><span class="legal-sep">·</span><a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal.privacy">隐私政策</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById('lang-switcher-container').innerHTML = renderLanguageSwitcher();

    // Auto-fill from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');

    if (userId) document.getElementById('user-id').value = userId;
    if (secret) document.getElementById('secret').value = secret;

    // Auto-verify if both params are present (clicked from email link)
    if (userId && secret) {
      (async () => {
        const form = document.getElementById('verify-form');
        form.style.display = 'none';
        document.querySelector('.divider').style.display = 'none';
        document.getElementById('resend-btn').style.display = 'none';
        document.querySelector('.subtitle').textContent = t('verify.verifying');

        try {
          await account.updateVerification(userId, secret);
          const subtitle = document.querySelector('.subtitle');
          subtitle.textContent = t('verify.success');
          subtitle.style.color = 'var(--success)';
          showToast(t('verify.verifySuccess'), 'success');
          setTimeout(() => navigateTo('dashboard.html'), 1500);
        } catch (err) {
          const messages = {
            'general_invalid_response': t('verify.invalidCode'),
            'general_rate_limit_exceeded': t('verify.rateLimit'),
          };
          const msg = messages[err.type] || err.message || t('verify.verifyFailed');
          const subtitle = document.querySelector('.subtitle');
          subtitle.textContent = msg;
          subtitle.style.color = 'var(--error)';
          // Show form again so user can retry manually or resend
          form.style.display = 'block';
          document.querySelector('.divider').style.display = 'flex';
          document.getElementById('resend-btn').style.display = 'inline-flex';
        }
      })();
    }

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('verify-alert');

      const uid = document.getElementById('user-id').value;
      const sec = document.getElementById('secret').value;

      if (!uid || !sec) {
        showAlert('verify-alert', t('verify.fillFields'), 'error');
        return;
      }

      setLoading('verify-btn', true);

      try {
        await account.updateVerification(uid, sec);
        showToast(t('verify.verifySuccess'), 'success');
        setTimeout(() => navigateTo('dashboard.html'), 1000);
      } catch (err) {
        const messages = {
          'general_invalid_response': t('verify.invalidCode'),
          'general_rate_limit_exceeded': t('verify.rateLimit'),
        };
        const msg = messages[err.type] || err.message || t('verify.verifyFailed');
        showAlert('verify-alert', msg, 'error');
      } finally {
        setLoading('verify-btn', false);
      }
    });

    async function resendVerification() {
      hideAlert('verify-alert');
      const user = await checkAuth();
      if (!user) {
        showAlert('verify-alert', t('verify.pleaseLogin'), 'error');
        return;
      }

      try {
        client.setLocale(getAppwriteLocale());
        await account.createVerification(window.location.origin + window.location.pathname);
        showToast(t('verify.resent'), 'success');
      } catch (err) {
        showAlert('verify-alert', err.message || t('verify.sendFailed'), 'error');
      }
    }
  </script>
</body>
</html>
