<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="verify.title">邮箱验证 - We Apps Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="lang-switcher-container" style="position:fixed;top:1.5rem;right:1.5rem;z-index:100;"></div>

  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/We.png" alt="We Apps" class="logo-large">
        <h1 data-i18n="verify.heading">验证邮箱</h1>
        <p data-i18n="verify.tagline">确认您的邮箱地址以完成账户设置</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <img src="assets/We.png" alt="We" class="logo-small">
        <h2 data-i18n="verify.verifyEmail">邮箱验证</h2>
        <div id="verify-alert" class="alert"></div>

        <p class="subtitle" id="verify-status" data-i18n="verify.verifying">正在验证您的邮箱，请稍候...</p>

        <button id="resend-btn" class="btn btn-secondary" style="width:100%;display:none;" onclick="resendVerification()">
          <span data-i18n="verify.resend">重新发送验证邮件</span>
        </button>

        <div class="auth-footer">
          <a href="index.html" data-i18n="common.backToLogin">返回登录</a>
        </div>
        <div class="auth-footer auth-footer-legal">
          <a href="terms.html" target="_blank" rel="noopener" data-i18n="legal.terms">服务条款</a><span class="legal-sep">·</span><a href="privacy.html" target="_blank" rel="noopener" data-i18n="legal.privacy">隐私政策</a><span class="legal-sep">·</span><a href="aup.html" target="_blank" rel="noopener" data-i18n="legal.aup">可接受使用政策</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    document.getElementById('lang-switcher-container').innerHTML = renderLanguageSwitcher();

    // Ensure Appwrite is initialized before any verification logic
    initAppwrite();

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');
    const statusEl = document.getElementById('verify-status');
    const resendBtn = document.getElementById('resend-btn');

    if (userId && secret) {
      // Auto-verify from email link
      (async () => {
        try {
          await account.updateVerification(userId, secret);
          statusEl.textContent = t('verify.success');
          statusEl.style.color = 'var(--success)';
          showToast(t('verify.verifySuccess'), 'success');
          setTimeout(() => navigateTo('dashboard.html'), 1500);
        } catch (err) {
          const messages = {
            'general_invalid_response': t('verify.invalidCode'),
            'general_rate_limit_exceeded': t('verify.rateLimit'),
          };
          statusEl.textContent = messages[err.type] || err.message || t('verify.verifyFailed');
          statusEl.style.color = 'var(--error)';
          resendBtn.style.display = 'inline-flex';
        }
      })();
    } else {
      // No URL params — show resend option
      (async () => {
        const user = await checkAuth();
        if (user) {
          statusEl.textContent = t('verify.clickResend');
          resendBtn.style.display = 'inline-flex';
        } else {
          statusEl.textContent = t('verify.pleaseLogin');
        }
      })();
    }

    async function resendVerification() {
      hideAlert('verify-alert');
      const user = await checkAuth();
      if (!user) {
        showAlert('verify-alert', t('verify.pleaseLogin'), 'error');
        return;
      }

      try {
        client.setLocale(getAppwriteLocale());
        await account.createVerification(window.location.origin + window.location.pathname);
        showToast(t('verify.resent'), 'success');
      } catch (err) {
        showAlert('verify-alert', err.message || t('verify.sendFailed'), 'error');
      }
    }
  </script>
</body>
</html>
