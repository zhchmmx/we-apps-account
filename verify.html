<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮箱验证 - We Apps Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/We.png" alt="We Apps" class="logo-large">
        <h1>验证邮箱</h1>
        <p>确认您的邮箱地址以完成账户设置</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">
        <img src="assets/We.png" alt="We" class="logo-small">
        <h2>邮箱验证</h2>
        <p class="subtitle">请输入您收到的验证码</p>

        <div id="verify-alert" class="alert"></div>

        <form id="verify-form" novalidate>
          <div class="form-group">
            <label for="user-id">用户 ID</label>
            <input type="text" id="user-id" class="form-input" placeholder="从邮件链接中获取" readonly>
          </div>

          <div class="form-group">
            <label for="secret">验证码 <span class="required">*</span></label>
            <input type="text" id="secret" class="form-input" placeholder="输入验证码" required>
          </div>

          <button type="submit" id="verify-btn" class="btn btn-primary">
            <span class="spinner"></span>
            <span class="btn-text">验证邮箱</span>
          </button>
        </form>

        <div class="divider">或者</div>

        <button id="resend-btn" class="btn btn-secondary" style="width:100%;" onclick="resendVerification()">
          重新发送验证邮件
        </button>

        <div class="auth-footer">
          <a href="index.html">返回登录</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Auto-fill from URL params
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');
    const secret = urlParams.get('secret');

    if (userId) document.getElementById('user-id').value = userId;
    if (secret) document.getElementById('secret').value = secret;

    // Auto-verify if both params are present (clicked from email link)
    if (userId && secret) {
      (async () => {
        const btn = document.getElementById('verify-btn');
        const form = document.getElementById('verify-form');
        form.style.display = 'none';
        document.querySelector('.divider').style.display = 'none';
        document.getElementById('resend-btn').style.display = 'none';
        document.querySelector('.subtitle').textContent = '正在验证您的邮箱，请稍候...';

        try {
          await account.updateVerification(userId, secret);
          document.querySelector('.subtitle').textContent = '邮箱验证成功！正在跳转...';
          document.querySelector('.subtitle').style.color = 'var(--success)';
          showToast('邮箱验证成功！', 'success');
          setTimeout(() => navigateTo('dashboard.html'), 1500);
        } catch (err) {
          const messages = {
            'general_invalid_response': '验证码无效或已过期',
            'general_rate_limit_exceeded': '请求过于频繁，请稍后再试',
          };
          const msg = messages[err.type] || err.message || '验证失败，请重试';
          document.querySelector('.subtitle').textContent = msg;
          document.querySelector('.subtitle').style.color = 'var(--error)';
          // Show form again so user can retry manually or resend
          form.style.display = 'block';
          document.querySelector('.divider').style.display = 'flex';
          document.getElementById('resend-btn').style.display = 'inline-flex';
        }
      })();
    }

    document.getElementById('verify-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('verify-alert');

      const uid = document.getElementById('user-id').value;
      const sec = document.getElementById('secret').value;

      if (!uid || !sec) {
        showAlert('verify-alert', '请填写用户 ID 和验证码', 'error');
        return;
      }

      setLoading('verify-btn', true);

      try {
        await account.updateVerification(uid, sec);
        showToast('邮箱验证成功！', 'success');
        setTimeout(() => navigateTo('dashboard.html'), 1000);
      } catch (err) {
        const messages = {
          'general_invalid_response': '验证码无效或已过期',
          'general_rate_limit_exceeded': '请求过于频繁，请稍后再试',
        };
        const msg = messages[err.type] || err.message || '验证失败，请重试';
        showAlert('verify-alert', msg, 'error');
      } finally {
        setLoading('verify-btn', false);
      }
    });

    async function resendVerification() {
      hideAlert('verify-alert');
      const user = await checkAuth();
      if (!user) {
        showAlert('verify-alert', '请先登录', 'error');
        return;
      }

      try {
        await account.createVerification(window.location.origin + window.location.pathname);
        showToast('验证邮件已重新发送', 'success');
      } catch (err) {
        showAlert('verify-alert', err.message || '发送失败', 'error');
      }
    }
  </script>
</body>
</html>
