<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - We Apps Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-left-content .features {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }
    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: rgba(255,255,255,0.8);
      font-size: 0.95rem;
    }
    .feature-item .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-light);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="auth-layout">
    <!-- Left Panel -->
    <div class="auth-left">
      <div class="auth-left-content">
        <img src="assets/We.png" alt="We Apps" class="logo-large">
        <h1>加入 We Apps</h1>
        <p>创建您的账户，开启无限可能</p>
        <div class="features">
          <div class="feature-item"><span class="dot"></span>免费创建，即刻使用</div>
          <div class="feature-item"><span class="dot"></span>安全可靠的账户保护</div>
          <div class="feature-item"><span class="dot"></span>无缝连接所有 We Apps 服务</div>
        </div>
      </div>
    </div>

    <!-- Right Panel - Register Form -->
    <div class="auth-right">
      <div class="auth-card">
        <img src="assets/We.png" alt="We" class="logo-small">
        <h2>创建账户</h2>
        <p class="subtitle">注册 We Apps 账户</p>

        <div id="register-alert" class="alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" class="form-input" placeholder="您的姓名（可选）" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email">电子邮件 <span class="required">*</span></label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">密码 <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-input" placeholder="至少 8 个字符" required autocomplete="new-password">
              <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="切换密码可见性">👁</button>
            </div>
            <div class="password-strength">
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
              <div class="strength-bar"></div>
            </div>
            <div class="strength-text"></div>
          </div>

          <div class="form-group">
            <label for="confirm-password">确认密码 <span class="required">*</span></label>
            <div class="password-wrapper">
              <input type="password" id="confirm-password" class="form-input" placeholder="再次输入密码" required autocomplete="new-password">
              <button type="button" class="password-toggle" onclick="togglePassword('confirm-password', this)" aria-label="切换密码可见性">👁</button>
            </div>
            <div class="form-error" id="password-match-error">两次输入的密码不一致</div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="terms" required>
            <label for="terms">我已阅读并同意 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></label>
          </div>

          <button type="submit" id="register-btn" class="btn btn-primary">
            <span class="spinner"></span>
            <span class="btn-text">创建账户</span>
          </button>
        </form>

        <div class="auth-footer">
          已有账户？<a href="index.html">立即登录</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@16.1.0"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Password strength
    document.getElementById('password').addEventListener('input', (e) => {
      updatePasswordStrength(e.target.value);
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert('register-alert');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const terms = document.getElementById('terms').checked;

      // Validation
      if (!email || !validateEmail(email)) {
        showAlert('register-alert', '请输入有效的电子邮件地址', 'error');
        return;
      }

      if (!password || !validatePassword(password)) {
        showAlert('register-alert', '密码至少需要 8 个字符', 'error');
        return;
      }

      if (password !== confirmPassword) {
        document.getElementById('password-match-error').classList.add('visible');
        return;
      } else {
        document.getElementById('password-match-error').classList.remove('visible');
      }

      if (!terms) {
        showAlert('register-alert', '请同意服务条款和隐私政策', 'error');
        return;
      }

      setLoading('register-btn', true);

      try {
        await account.create({
          userId: Appwrite.ID.unique(),
          email,
          password,
          name: name || undefined
        });

        // Auto-login after registration
        await account.createEmailPasswordSession({ email, password });
        showToast('注册成功！', 'success');
        setTimeout(() => navigateTo('dashboard.html'), 800);
      } catch (err) {
        const messages = {
          'user_already_exists': '该电子邮件已被注册',
          'general_rate_limit_exceeded': '请求过于频繁，请稍后再试',
          'user_password_mismatch': '密码不符合安全要求',
        };
        const msg = messages[err.type] || err.message || '注册失败，请重试';
        showAlert('register-alert', msg, 'error');
      } finally {
        setLoading('register-btn', false);
      }
    });

    document.querySelectorAll('.form-input').forEach(input => {
      input.addEventListener('input', () => input.classList.remove('error'));
    });
  </script>
</body>
</html>
